# ============================================================================
# FAST-Calib2 per-camera config — copy to config/cameras/<cam>.yaml
# ----------------------------------------------------------------------------
# One file per physical camera. Used as:
#   $FC/fast_calib --config config/cameras/<cam>.yaml \
#                  --scene calib_data/<cam>/<scene> --output output/<cam>
#
# Expected data layout (relative to the directory you run from):
#   config/cameras/<cam>.yaml            <- this file
#   calib_data/<cam>/<scene>/image.png       camera frame
#   calib_data/<cam>/<scene>/record/rec.*    cyber record of the LiDAR channel
#                                            (or cloud.pcd instead of record/)
#   calib_data/<cam>/<scene>/cloud_roi.txt   optional manual ROI (pick_roi.py),
#                                            auto-applied per scene
#   output/<cam>/                            results
#
#  >>> TODO: replace every value marked  # TODO  with this camera's real value.
#      Until then the extrinsic result is meaningless.
# ============================================================================

# --- Camera intrinsics (pinhole + radial/tangential distortion) -------------
# TODO: paste this exact camera's calibrated intrinsics (chessboard). A wrong
#       focal length silently shifts the extrinsic translation.
  fx: 1000.0   # TODO
  fy: 1000.0   # TODO
  cx: 960.0    # TODO  (~ image_width / 2)
  cy: 540.0    # TODO  (~ image_height / 2)
  k1: 0.0      # TODO
  k2: 0.0      # TODO
  p1: 0.0      # TODO
  p2: 0.0      # TODO

# --- Calibration target geometry --------------------------------------------
# The reflective annular board (see README section 2). Measure YOUR physical
# board; values below are the repo's standard board.
  marker_size: 0.20            # ArUco marker side length [m]
  delta_width_qr_center: 0.55  # half horizontal distance between marker centers
  delta_height_qr_center: 0.35 # half vertical distance between marker centers
  delta_width_circles: 0.5     # horizontal distance between annulus centers
  delta_height_circles: 0.4    # vertical distance between annulus centers
  circle_radius: 0.12          # annulus centerline radius [m]
  annulus_half_width: 0.025    # (outer_r - inner_r) / 2 [m]
  board_width: 1.4
  board_height: 1.0
  board_roi_margin: 0.08
  board_roi_depth: 0.12
  auto_roi_voxel_leaf: 0.01
  annulus_voxel_leaf: 0.005
  min_detected_markers: 3

# --- LiDAR source ------------------------------------------------------------
# The Apollo channel to read from the cyber record (ignored for cloud.pcd
# input). lidar_frame / camera_frame name the frames in the Apollo extrinsics
# YAML output.
  lidar_channel: "/apollo/sensor/<lidar>/PointCloud2"   # TODO
  lidar_frame: "lidar"          # TODO e.g. hesai_main_front
  camera_frame: "camera"        # TODO e.g. cam0
  max_fusion_frames: 0          # 0 = fuse every frame in the record (static scene)

# Scan-line (ring) synthesis — ONLY for low-line mechanical LiDARs whose
# clouds carry no ring field (e.g. a 16-line: list its nominal beam altitudes,
# top to bottom). Leave commented for dense/solid LiDARs (AT128, Livox, ...):
# they use the solid pipeline.
#  beam_altitudes_deg: [14, 12, 10, 8, 6, 4, 2, 0, -2, -4, -6, -8, -10, -12, -14, -16]

# --- Board ROI ---------------------------------------------------------------
# Automatic board ROI extraction. Leave true to skip manual tuning. If auto-ROI
# fails for a scene (sparse cloud, other reflectors, wall behind the board),
# run scripts/pick_roi.py — it writes the box here and drops a cloud_roi.txt
# next to the scene's cloud, which is auto-applied per scene.
  use_auto_lidar_roi: true
  x_min: 1.5
  x_max: 5.0
  y_min: -2.0
  y_max: 2.0
  z_min: -1.0
  z_max: 2.0

# --- Detector tuning (optional; defaults shown) ------------------------------
# Per-rig tuning lives here now — no source edits or rebuild. Typical cases:
# sparse 16-line: mech_cluster_min_size 20, mech_cluster_tolerance 0.13;
# dense non-uniform (AT128): annulus_cluster_min_size 30,
# annulus_cluster_tolerance 0.06-0.10; bright ring points dropped "off-plane":
# widen the plane inlier thresholds.
#  board_plane_inlier_threshold: 0.07
#  annulus_plane_inlier_threshold: 0.07
#  boundary_plane_inlier_threshold: 0.03
#  annulus_cluster_tolerance: 0.10
#  annulus_cluster_min_size: 30
#  mech_cluster_tolerance: 0.09
#  mech_cluster_min_size: 80
#  auto_roi_cluster_min_size: 200

# --- I/O ---------------------------------------------------------------------
# image_path / cloud_path / output_path come from --scene and --output on the
# command line, so they are intentionally omitted here.
