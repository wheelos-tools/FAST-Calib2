# ============================================================================
# FAST-Calib2 per-camera config  --  cam3  (car-ningde-orin)
# ----------------------------------------------------------------------------
# The launch files (calib_cam.launch / multi_calib_cam.launch) load this by
# `cam:=cam3`.
#
# Camera: Hikvision IP camera 192.168.1.67 (h265, 1920x1080@25),
#   rtsp://<user>:<pass>@192.168.1.67:554/live  (credentials in calib_env.sh,
#   which is intentionally not committed).
# ============================================================================

# --- Camera intrinsics (pinhole + radial/tangential distortion) -------------
# From /home/nvidia/02code/repo/intrinsics/intrinsics_cam67.yaml on the car
# (chessboard runs of 2026-05-28, per-view mean reprojection 0.19-0.24 px).
# k3 from that file is intentionally dropped: FAST-Calib2 uses k1 k2 p1 p2 only.
  fx: 1380.6853686087584
  fy: 1381.4284366935829
  cx: 988.298116388784
  cy: 539.7380121174729
  k1: -0.4201602180497264
  k2: 0.22691812585286528
  p1: 0.00023864911713563272
  p2: 0.00026349058277637725

# --- Calibration target geometry --------------------------------------------
# These describe the reflective annular board (see README section 2). Adjust to
# match the physical target you actually use; defaults are the repo's example.
  marker_size: 0.20            # ArUco marker side length [m]
  delta_width_qr_center: 0.55  # half horizontal distance between marker centers
  delta_height_qr_center: 0.35 # half vertical distance between marker centers
  delta_width_circles: 0.5     # horizontal distance between annulus centers
  delta_height_circles: 0.4    # vertical distance between annulus centers
  circle_radius: 0.12          # annulus centerline radius [m]
  annulus_half_width: 0.025    # (outer_r - inner_r) / 2 [m]
  board_width: 1.4
  board_height: 1.0
  board_roi_margin: 0.08
  board_roi_depth: 0.12
  auto_roi_voxel_leaf: 0.01
  annulus_voxel_leaf: 0.005
  min_detected_markers: 3

# --- LiDAR -------------------------------------------------------------------
# car-ningde-orin has two Hesai AT128 (left=192.168.1.201, right=192.168.1.202)
# and one Livox front, all published by the always-running production stack
# (CYBER_DOMAIN_ID=80) -- no driver needs to be started for calibration.
# AT128/Livox clouds are dense with non-uniform beams: record cloud.bag with
# RING_FLAG=--no-ring so FAST-Calib2 uses the solid-state pipeline.
# lidar_topic is the topic INSIDE cloud.bag (written by pcd_to_bag.py), NOT the
# Cyber channel name (that is set via CH= for capture_scene.sh).
  lidar_topic: "/lidar_points"

# Automatic board ROI extraction. Leave true to skip manual passthrough tuning.
# If auto-ROI fails for a scene, set false and tune the x/y/z window below.
  use_auto_lidar_roi: true
  x_min: 1.5
  x_max: 5.0
  y_min: -2.0
  y_max: 2.0
  z_min: -1.0
  z_max: 2.0

# --- I/O --------------------------------------------------------------------
# image_path / bag_path / output_path are set by the launch file from the
# cam:= and scene:= args, so they are intentionally omitted here.
